spring.application.name=car-rental-api

# Render (and most hosts) give the port in the PORT env variable, 8080 locally
server.port=${PORT:8080}

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:carrentaldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console -> http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:carrentaldb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# run data.sql AFTER hibernate creates the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# entities are converted to DTOs inside the services, so this is not needed
spring.jpa.open-in-view=false
